<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyMate AI — Design Preview</title>
<style>
body{margin:0;background:#f5f8fc;color:#172b4d;font-family:Inter,system-ui,sans-serif}
.wrap{max-width:900px;margin:40px auto;padding:20px}.preview{background:white;border:1px solid #d9e2ec;border-radius:24px;padding:32px;box-shadow:0 12px 35px rgba(16,42,67,.08)}
.badge{display:inline-block;background:#e8f1ff;color:#1769e0;padding:8px 12px;border-radius:999px;font-weight:800;font-size:12px}
h1{font-size:48px;line-height:1.05;margin:18px 0 12px}p{color:#6b7c93;line-height:1.6}
input{width:100%;padding:15px;border:2px solid #d9e2ec;border-radius:12px;font-size:16px;box-sizing:border-box}
button{margin-top:12px;background:#1769e0;color:white;border:0;border-radius:12px;padding:14px 22px;font-weight:800;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:25px}.box{background:#f7faff;border-radius:16px;padding:20px}
@media(max-width:650px){h1{font-size:36px}.row{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><div class="preview">
<span class="badge">AI-ASSISTED STUDY COMPANION</span>
<h1>StudyMate AI</h1>
<p>A clean, focused interface for turning study goals into practical revision plans.</p>
<label><strong>Study topic</strong></label><br><br>
<input placeholder="e.g. Constitutional Law">
<button>Generate Study Plan</button>
<div class="row"><div class="box"><strong>68%</strong><p>Current study progress</p></div><div class="box"><strong>5 days</strong><p>Current study streak</p></div></div>
</div></div></body></html>
